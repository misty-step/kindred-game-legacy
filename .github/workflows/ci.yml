name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful exact-head CI run containing the verified worker
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Anonymous loopback only; no cloud credentials or services in CI.
      NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3220
      NEXT_PUBLIC_CONVEX_SITE_URL: http://127.0.0.1:3221
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run canonical checks
        run: pnpm check
      - name: Build the immutable Convex-backed repair
        env:
          PRODUCT_ENVIRONMENT: production
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          node scripts/deploy-cloudflare.mjs --build-only
          pnpm exec wrangler deploy --dry-run --outdir candidate
          printf '%s\n' "$GITHUB_SHA" > candidate/source.txt
          python3 -c 'import hashlib,pathlib; files=[pathlib.Path("candidate/worker.js"),*sorted(p for p in pathlib.Path(".open-next/assets").rglob("*") if p.is_file())]; pathlib.Path("candidate/SHA256SUMS").write_text("".join(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+str(p)+"\n" for p in files))'
      - uses: actions/upload-artifact@v4
        with:
          name: kindred-worker
          include-hidden-files: true
          retention-days: 30
          path: |
            candidate/
            .open-next/assets/

  production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    concurrency:
      group: kindred-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Select the successful exact-head artifact without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.artifact_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN" > run.json
          python3 -c 'import json,os; d=json.load(open("run.json")); assert d["conclusion"]=="success" and d["name"]=="CI" and d["head_sha"]==os.environ["GITHUB_SHA"] and d["event"]=="push"'
          gh run download "$ARTIFACT_RUN" -R "$GITHUB_REPOSITORY" -n kindred-worker
          test "$(cat candidate/source.txt)" = "$GITHUB_SHA"
          sha256sum -c candidate/SHA256SUMS
      - name: Promote the origin repair, preserving all existing runtime secrets
        env:
          OPEN_NEXT_DEPLOY: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)" = "$GITHUB_SHA"
          pnpm exec wrangler deploy candidate/worker.js --no-bundle
          node -e 'process.stdout.write(JSON.stringify({SENTRY_RELEASE:process.env.GITHUB_SHA}))' | pnpm exec wrangler secret bulk
